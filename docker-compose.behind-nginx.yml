# Overlay for the sctr Ubuntu droplet (nginx already owns :80/:443).
# Usage:
#   docker compose -f docker-compose.yml -f docker-compose.behind-nginx.yml up -d --build
#
# Caddy is disabled. App is loopback-only; nginx proxies lumen.greednews.com.
# Host nginx must allow large uploads, e.g. client_max_body_size 30m;
# Do not set `proxy_set_header Connection upgrade;` on the whole `/` location —
# that breaks Next.js server actions (Save). Use `Connection ""` unless the
# location is specifically for WebSockets.

services:
  caddy:
    profiles:
      - caddy

  app:
    ports:
      - "127.0.0.1:3010:3000"
