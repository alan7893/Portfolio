# Apache 2.4 vhost for Kids Portfolio on the existing greednews.com droplet.
# Install to /etc/httpd/conf.d/portfolio.greednews.com.conf (CentOS/RHEL httpd).
#
# Requires: mod_ssl, mod_proxy, mod_proxy_http, mod_headers
# SELinux: setsebool -P httpd_can_network_connect 1

<VirtualHost *:80>
	ServerName portfolio.greednews.com
	ProxyPreserveHost On
	RequestHeader set X-Forwarded-Proto "http"
	RequestHeader set X-Forwarded-Port "80"
	ProxyPass / http://127.0.0.1:3000/
	ProxyPassReverse / http://127.0.0.1:3000/
</VirtualHost>

<IfModule mod_ssl.c>
<VirtualHost *:443>
	ServerName portfolio.greednews.com
	SSLEngine on
	SSLCertificateFile /etc/pki/tls/certs/portfolio.greednews.com.crt
	SSLCertificateKeyFile /etc/pki/tls/private/portfolio.greednews.com.key

	ProxyPreserveHost On
	RequestHeader set X-Forwarded-Proto "https"
	RequestHeader set X-Forwarded-Port "443"
	AllowEncodedSlashes NoDecode
	ProxyPass / http://127.0.0.1:3000/
	ProxyPassReverse / http://127.0.0.1:3000/

	# Above the 25MB per-file upload cap.
	LimitRequestBody 31457280
	ProxyTimeout 120
</VirtualHost>
</IfModule>
