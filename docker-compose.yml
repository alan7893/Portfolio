services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-kids}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-kids_dev_pw}
      POSTGRES_DB: ${POSTGRES_DB:-kids_portfolio}
    volumes:
      - pgdata:/var/lib/postgresql/data
    # SECURITY: Postgres is NOT published to the host. Only the app reaches it
    # over the internal Docker network. For local development you may expose it
    # bound to loopback only by uncommenting the block below:
    # ports:
    #   - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-kids} -d ${POSTGRES_DB:-kids_portfolio}"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: "postgresql://${POSTGRES_USER:-kids}:${POSTGRES_PASSWORD:-kids_dev_pw}@db:5432/${POSTGRES_DB:-kids_portfolio}?schema=public"
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:?set NEXTAUTH_SECRET in .env}
      NEXTAUTH_URL: ${NEXTAUTH_URL:-https://portfolio.greednews.com}
      ADMIN_EMAIL: ${ADMIN_EMAIL:?set ADMIN_EMAIL in .env}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?set ADMIN_PASSWORD in .env}
      UPLOAD_DIR: /app/uploads
    volumes:
      - uploads:/app/uploads
    # App is only reachable through Caddy; no host port published.
    expose:
      - "3000"

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./caddy/certs:/etc/caddy/certs:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  pgdata:
  uploads:
  caddy_data:
  caddy_config:
